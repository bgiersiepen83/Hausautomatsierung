<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wohnungsplaner 3D</title>
<style>
  :root {
    --bg: #f4f5f7; --panel: #ffffff; --line: #d9dde3; --text: #1f2328; --muted: #646d78;
    --accent: #2f6fd6; --accent-weak: #e3ecfb; --danger: #c43b3b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: grid; grid-template-rows: auto 1fr; grid-template-columns: 270px 1fr; height: 100vh; overflow: hidden;
  }
  header {
    grid-column: 1 / 3; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center;
    padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 15px; margin: 0 6px 0 0; }
  .group { display: flex; gap: 4px; align-items: center; }
  .group > .lbl { color: var(--muted); margin-right: 2px; }
  button, select, input[type=number], input[type=text] {
    font: inherit; color: inherit; background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px;
  }
  button { cursor: pointer; }
  button:hover { background: var(--accent-weak); }
  button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { color: var(--danger); }
  button:disabled { opacity: .45; cursor: default; background: #fff; }
  button.active:disabled { background: var(--accent-weak); color: var(--text); }
  aside { overflow-y: auto; background: var(--panel); border-right: 1px solid var(--line); padding: 10px 12px; }
  aside h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 14px 0 6px; }
  aside h2:first-child { margin-top: 0; }
  aside h3 { font-size: 14px; margin: 0 0 8px; }
  .cat-group { font-weight: 600; margin: 8px 0 4px; }
  .catalog { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
  .catalog button { text-align: left; padding: 4px 6px; font-size: 12px; }
  #props label { display: block; margin: 6px 0; color: var(--muted); }
  #props label input, #props label select { display: block; width: 100%; margin-top: 2px; color: var(--text); }
  #props input[type=color] { height: 30px; padding: 0 2px; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 8px; }
  .row { display: flex; gap: 4px; flex-wrap: wrap; margin: 6px 0; }
  .hint { color: var(--muted); font-size: 12px; }
  main { position: relative; overflow: hidden; }
  #viewport { position: absolute; inset: 0; }
  #viewport canvas { display: block; touch-action: none; }
  #status {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 5px 10px; font-size: 12px;
    background: rgba(255,255,255,.88); border-top: 1px solid var(--line); display: flex; gap: 16px; justify-content: space-between;
  }
  #status .warn { color: var(--danger); }
  #loadError { position: absolute; inset: 0; display: none; place-items: center; text-align: center; padding: 20px; }
  #labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .room-label {
    position: absolute; left: 0; top: 0; white-space: nowrap; text-align: center; font-size: 12px; line-height: 1.25;
    background: rgba(255,255,255,.85); border: 1px solid var(--line); border-radius: 6px; padding: 2px 6px;
  }
  .room-label b { font-weight: 600; }
  #drawBar { position: absolute; top: 10px; right: 10px; display: none; gap: 6px; }
  #drawBar button { box-shadow: 0 2px 8px rgba(0,0,0,.15); }
  table.rooms { width: 100%; border-collapse: collapse; margin: 4px 0 8px; }
  table.rooms td { padding: 4px 2px; border-bottom: 1px solid var(--line); }
  table.rooms td:last-child { text-align: right; white-space: nowrap; }
  table.rooms tr[data-room] { cursor: pointer; }
  table.rooms tr[data-room]:hover { background: var(--accent-weak); }
  table.rooms tr.sum td { font-weight: 600; border-bottom: none; }
  .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; border: 1px solid rgba(0,0,0,.2); }
  .warn { color: var(--danger); }
  .mat-ed { border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; margin: 4px 0; }
  .mat-head { display: flex; gap: 8px; align-items: flex-end; }
  .mat-head label { flex: 1; margin: 0 !important; }
  .mat-prev { width: 44px; height: 44px; border-radius: 6px; border: 1px solid var(--line); flex: none; }
  body { touch-action: manipulation; }
  #panelToggle { display: none; }

  /* Tablet / Handy: Seitenleiste wird zum ausklappbaren Bereich unten */
  @media (max-width: 900px) {
    body { grid-template-columns: 1fr; }
    header { grid-column: 1; flex-wrap: nowrap; overflow-x: auto; }
    header .group, header h1 { flex: none; }
    main { grid-column: 1; grid-row: 2; }
    aside {
      position: fixed; left: 0; right: 0; bottom: 0; height: 55vh; z-index: 20; border-right: none;
      border-top: 1px solid var(--line); box-shadow: 0 -4px 16px rgba(0,0,0,.15);
      transform: translateY(100%); transition: transform .2s ease;
    }
    body.panel-open aside { transform: none; }
    #panelToggle { display: inline-block; }
  }
  @media (pointer: coarse) {
    button, select, input[type=number], input[type=text] { min-height: 38px; padding: 6px 10px; }
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<header>
  <button id="panelToggle" title="Möbel &amp; Eigenschaften ein-/ausblenden">☰ Panel</button>
  <h1>Wohnungsplaner 3D</h1>
  <div class="group">
    <span class="lbl">Ansicht</span>
    <button id="view2d" class="active">2D-Grundriss</button>
    <button id="view3d">3D</button>
    <button id="fitView" title="Ansicht auf die Wohnung zentrieren">Zentrieren</button>
  </div>
  <div class="group" id="toolGroup">
    <span class="lbl">Werkzeug</span>
    <button data-tool="select" class="active" title="Auswählen / Verschieben (V)">Auswählen</button>
    <button data-tool="wall" title="Wände zeichnen (W)">Wand</button>
    <button data-tool="door" title="Tür in Wand einsetzen (T)">Tür</button>
    <button data-tool="window" title="Fenster in Wand einsetzen (F)">Fenster</button>
    <button data-tool="room" title="In einen umschlossenen Bereich klicken: Raum wird erkannt">Raum</button>
    <button data-tool="roomdraw" title="Raum als Polygon von Hand zeichnen">Raum ✎</button>
    <button data-tool="calibrate" title="Maßstab des Grundriss-Bildes festlegen">Maßstab</button>
  </div>
  <div class="group">
    <span class="lbl">Grundriss-Bild</span>
    <button id="loadImage">Laden…</button>
    <input type="file" id="imageFile" accept="image/*" hidden>
    <input type="range" id="planOpacity" min="0" max="1" step="0.05" title="Deckkraft">
    <label title="Grundriss-Bild auch in der 3D-Ansicht auf dem Boden zeigen"><input type="checkbox" id="plan3d"> in 3D</label>
  </div>
  <div class="group">
    <span class="lbl">Wände (3D)</span>
    <select id="wallMode">
      <option value="full">voll</option>
      <option value="transparent">transparent</option>
      <option value="low">niedrig (1 m)</option>
    </select>
  </div>
  <div class="group">
    <span class="lbl">Variante</span>
    <select id="variantSelect"></select>
    <button id="variantNew" title="Aktuelle Einrichtung als neue Variante kopieren">+ Kopie</button>
    <button id="variantRename">Umbenennen</button>
    <button id="variantDelete" class="danger">Löschen</button>
  </div>
  <div class="group">
    <button id="undo" title="Rückgängig (Strg+Z)">↶</button>
    <button id="redo" title="Wiederholen (Strg+Y)">↷</button>
    <button id="exportJson">Export</button>
    <button id="importJson">Import</button>
    <input type="file" id="jsonFile" accept="application/json,.json" hidden>
    <button id="resetAll" class="danger" title="Alles löschen und neu beginnen">Neu</button>
  </div>
</header>

<aside>
  <h2>Eigenschaften</h2>
  <div id="props"></div>
  <h2>Möbel hinzufügen</h2>
  <div id="catalog"></div>
</aside>

<main>
  <div id="viewport"></div>
  <div id="labels"></div>
  <div id="drawBar"><button id="drawDone" class="active">Fertig</button><button id="drawCancel">Abbrechen</button></div>
  <div id="status"><span id="hint"></span><span id="coords"></span></div>
  <div id="loadError">three.js konnte nicht geladen werden. Bitte Internetverbindung prüfen<br>(benötigt Zugriff auf cdn.jsdelivr.net).</div>
</main>

<script>
  // Fallback-Hinweis, falls das Modul (three.js vom CDN) nicht lädt
  window.__plannerStarted = false;
  setTimeout(() => { if (!window.__plannerStarted) document.getElementById('loadError').style.display = 'grid'; }, 8000);
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

window.__plannerStarted = true;

// ---------------------------------------------------------------------------
// Grundeinstellungen & Datenmodell (alle Längen in Metern)
// ---------------------------------------------------------------------------
const STORAGE_KEY = 'wohnungsplaner.v1';
const DEFAULT_SETTINGS = {
  wallHeight: 2.5, wallThickness: 0.15,
  doorWidth: 0.9, doorHeight: 2.0,
  windowWidth: 1.2, windowSill: 0.9, windowTop: 2.1,
  floorColor: '#d8c7a8', wallMode: 'full',
};

const uid = () => Math.random().toString(36).slice(2, 10);

function newState() {
  return {
    version: 1,
    settings: { ...DEFAULT_SETTINGS },
    plan: { image: null, width: 10, aspect: 1, opacity: 0.6, show3d: false },
    walls: [],
    rooms: [],
    variants: [{ id: uid(), name: 'Variante 1', items: [], roomColors: {}, floors: {}, roomWalls: {}, wallSides: {} }],
    activeVariant: null,
  };
}

// ---------------------------------------------------------------------------
// Möbel-Katalog: einfache, parametrische Formen
// ---------------------------------------------------------------------------
const matCache = new Map();
function mat(color, opts = {}) {
  const key = color + JSON.stringify(opts);
  if (!matCache.has(key)) matCache.set(key, new THREE.MeshStandardMaterial({ color, roughness: 0.8, metalness: 0, ...opts }));
  return matCache.get(key);
}
function shade(hex, f) {
  const c = new THREE.Color(hex);
  if (f < 1) c.multiplyScalar(f); else c.lerp(new THREE.Color('#ffffff'), Math.min(1, f - 1));
  return '#' + c.getHexString();
}
// Quader mit Unterkante auf y
function box(g, w, h, d, x, y, z, color, opts) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(Math.max(w, 0.002), Math.max(h, 0.002), Math.max(d, 0.002)), mat(color, opts));
  m.position.set(x, y + Math.max(h, 0.002) / 2, z);
  m.castShadow = m.receiveShadow = true;
  g.add(m);
  return m;
}
function cyl(g, rTop, rBot, h, x, y, z, color, opts) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rTop, rBot, Math.max(h, 0.002), 24), mat(color, opts));
  m.position.set(x, y + h / 2, z);
  m.castShadow = m.receiveShadow = true;
  g.add(m);
  return m;
}
const GLASS = { transparent: true, opacity: 0.3, roughness: 0.1, depthWrite: false };

const B = {
  sofa(g, { w, d, h, color: c }) {
    const arm = Math.min(0.22, w * 0.15), backD = Math.min(0.25, d * 0.3), seatH = Math.min(0.45, h * 0.55);
    box(g, w - 0.1, 0.1, d - 0.1, 0, 0, 0, shade(c, 0.35));
    box(g, w, seatH - 0.24, d, 0, 0.1, 0, c);
    box(g, w - 2 * arm, 0.14, d - backD - 0.02, 0, seatH - 0.14, backD / 2, shade(c, 1.12));
    box(g, w, h - 0.1, backD, 0, 0.1, -d / 2 + backD / 2, c);
    for (const s of [-1, 1]) box(g, arm, Math.min(h, seatH + 0.2) - 0.1, d, s * (w / 2 - arm / 2), 0.1, 0, c);
  },
  bed(g, { w, d, h, color: c }) {
    const frame = Math.min(0.3, h * 0.4);
    box(g, w, frame, d, 0, 0, 0, c);
    box(g, w - 0.06, 0.2, d - 0.1, 0, frame, 0.03, '#f3f1ec');
    box(g, w, h, 0.08, 0, 0, -d / 2 + 0.04, shade(c, 0.85));
    const n = w > 1.2 ? 2 : 1, pw = (w - 0.2) / n - 0.05;
    for (let i = 0; i < n; i++) box(g, pw, 0.12, 0.35, -w / 2 + 0.1 + (i + 0.5) * (w - 0.2) / n, frame + 0.2, -d / 2 + 0.33, '#ffffff');
    box(g, w - 0.02, 0.06, (d - 0.1) * 0.62, 0, frame + 0.2, d / 2 - (d - 0.1) * 0.31 - 0.04, shade(c, 1.45));
  },
  table(g, { w, d, h, color: c }) {
    const t = 0.04, l = 0.05, ix = w / 2 - 0.06 - l / 2, iz = d / 2 - 0.06 - l / 2;
    box(g, w, t, d, 0, h - t, 0, c);
    for (const sx of [-1, 1]) for (const sz of [-1, 1]) box(g, l, h - t, l, sx * ix, 0, sz * iz, shade(c, 0.6));
  },
  chair(g, { w, d, h, color: c }) {
    const seat = Math.min(0.46, h * 0.5), l = 0.035;
    for (const sx of [-1, 1]) for (const sz of [-1, 1]) box(g, l, seat, l, sx * (w / 2 - l), 0, sz * (d / 2 - l), shade(c, 0.6));
    box(g, w, 0.05, d, 0, seat, 0, c);
    box(g, w, h - seat - 0.05, 0.04, 0, seat + 0.05, -d / 2 + 0.02, c);
  },
  wardrobe(g, { w, d, h, color: c }) {
    box(g, w, h, d, 0, 0, 0, c);
    const n = Math.max(1, Math.round(w / 0.5)), dark = shade(c, 0.55);
    for (let i = 1; i < n; i++) box(g, 0.006, h - 0.04, 0.004, -w / 2 + (i * w) / n, 0.02, d / 2 + 0.002, dark);
    for (let i = 0; i < n; i++) {
      const x = -w / 2 + ((i + (i % 2 ? 0.12 : 0.88)) * w) / n;
      box(g, 0.015, 0.25, 0.02, x, h * 0.45, d / 2 + 0.01, '#8a8f96', { metalness: 0.6, roughness: 0.4 });
    }
  },
  shelf(g, { w, d, h, color: c }) {
    const t = 0.02;
    for (const s of [-1, 1]) box(g, t, h, d, s * (w / 2 - t / 2), 0, 0, c);
    const n = Math.max(2, Math.round(h / 0.38));
    for (let i = 0; i <= n; i++) box(g, w - 2 * t, t, d, 0, Math.min(h - t, (i * (h - t)) / n), 0, c);
    box(g, w - 2 * t, h, 0.005, 0, 0, -d / 2 + 0.003, shade(c, 0.85));
  },
  sideboard(g, { w, d, h, color: c }) {
    const leg = Math.min(0.1, h * 0.2);
    for (const sx of [-1, 1]) for (const sz of [-1, 1]) box(g, 0.03, leg, 0.03, sx * (w / 2 - 0.05), 0, sz * (d / 2 - 0.05), shade(c, 0.5));
    box(g, w, h - leg, d, 0, leg, 0, c);
    const n = Math.max(1, Math.round(w / 0.45));
    for (let i = 1; i < n; i++) box(g, 0.006, h - leg - 0.04, 0.004, -w / 2 + (i * w) / n, leg + 0.02, d / 2 + 0.002, shade(c, 0.55));
  },
  tv(g, { w, d, h, color: c }) {
    box(g, w, h, d, 0, 0, 0, c, { roughness: 0.3 });
    box(g, w - 0.03, h - 0.03, 0.002, 0, 0.015, d / 2 + 0.001, '#05070a', { roughness: 0.15 });
  },
  rug(g, { w, d, color: c }) {
    const m = box(g, w, 0.012, d, 0, 0, 0, c, { roughness: 1 });
    m.castShadow = false;
  },
  plant(g, { w, d, h, color: c }) {
    const r = Math.min(w, d) / 2, potH = h * 0.3;
    cyl(g, r * 0.6, r * 0.45, potH, 0, 0, 0, c);
    const s = new THREE.Mesh(new THREE.SphereGeometry(r, 14, 10), mat('#4f7d3a'));
    s.scale.y = (h - potH) / (2 * r);
    s.position.y = potH + (h - potH) / 2;
    s.castShadow = s.receiveShadow = true;
    g.add(s);
  },
  lamp(g, { w, h, color: c }) {
    cyl(g, w * 0.4, w * 0.4, 0.03, 0, 0, 0, '#3a3a3a');
    cyl(g, 0.012, 0.012, h - 0.3, 0, 0.03, 0, '#3a3a3a');
    cyl(g, w * 0.32, w * 0.5, 0.3, 0, h - 0.3, 0, c, { emissive: '#ffe2a8', emissiveIntensity: 0.35 });
  },
  kitchen(g, { w, d, h, color: c }) {
    const plinth = 0.1, top = 0.04;
    box(g, w, plinth, d - 0.06, 0, 0, -0.03, '#4a4a4a');
    box(g, w, h - plinth - top, d - 0.02, 0, plinth, -0.01, c);
    box(g, w, top, d, 0, h - top, 0, '#bdb6aa');
    const n = Math.max(1, Math.round(w / 0.6));
    for (let i = 1; i < n; i++) box(g, 0.006, h - plinth - top - 0.02, 0.004, -w / 2 + (i * w) / n, plinth + 0.01, d / 2 - 0.018, shade(c, 0.6));
  },
  fridge(g, { w, d, h, color: c }) {
    box(g, w, h, d, 0, 0, 0, c, { roughness: 0.4 });
    box(g, w - 0.01, 0.008, 0.004, 0, h * 0.62, d / 2 + 0.002, shade(c, 0.6));
    box(g, 0.02, 0.3, 0.03, w / 2 - 0.06, h * 0.68, d / 2 + 0.015, '#8a8f96', { metalness: 0.6, roughness: 0.4 });
  },
  bathtub(g, { w, d, h, color: c }) {
    box(g, w, h, d, 0, 0, 0, c, { roughness: 0.3 });
    box(g, w - 0.14, 0.02, d - 0.14, 0, h - 0.015, 0, '#cfe3ef', { roughness: 0.2 });
  },
  shower(g, { w, d, h, color: c }) {
    box(g, w, 0.05, d, 0, 0, 0, c, { roughness: 0.3 });
    box(g, w, h - 0.05, 0.01, 0, 0.05, d / 2 - 0.005, '#bfe0f2', GLASS);
    box(g, 0.01, h - 0.05, d, w / 2 - 0.005, 0.05, 0, '#bfe0f2', GLASS);
  },
  wc(g, { w, d, h, color: c }) {
    box(g, w, Math.min(0.4, h * 0.5), 0.18, 0, h - Math.min(0.4, h * 0.5), -d / 2 + 0.09, c, { roughness: 0.3 });
    const r = w / 2 * 0.95;
    const bowl = cyl(g, r, r * 0.75, 0.4, 0, 0, -d / 2 + 0.18 + (d - 0.18) / 2, c, { roughness: 0.3 });
    bowl.scale.z = (d - 0.18) / (2 * r);
  },
  basin(g, { w, d, h, color: c }) {
    box(g, w, h - 0.12, d - 0.02, 0, 0, -0.01, c);
    box(g, w, 0.12, d, 0, h - 0.12, 0, '#ffffff', { roughness: 0.3 });
    box(g, w * 0.6, 0.01, d * 0.6, 0, h - 0.005, 0.02, '#dfe9ef', { roughness: 0.2 });
  },
  box(g, { w, d, h, color: c }) { box(g, w, h, d, 0, 0, 0, c); },
};

// Typ-Schlüssel -> Bezeichnung, Gruppe, Standardmaße (B x T x H in m), Farbe, Erzeuger
const CATALOG = {
  sofa3:      { label: 'Sofa 3-Sitzer',  group: 'Wohnen',          w: 2.1,  d: 0.9,  h: 0.85, color: '#6b7b8c', b: 'sofa' },
  sofa2:      { label: 'Sofa 2-Sitzer',  group: 'Wohnen',          w: 1.6,  d: 0.9,  h: 0.85, color: '#6b7b8c', b: 'sofa' },
  armchair:   { label: 'Sessel',         group: 'Wohnen',          w: 0.85, d: 0.85, h: 0.85, color: '#a0785a', b: 'sofa' },
  coffee:     { label: 'Couchtisch',     group: 'Wohnen',          w: 1.0,  d: 0.6,  h: 0.42, color: '#8b6a4a', b: 'table' },
  tvboard:    { label: 'TV-Board',       group: 'Wohnen',          w: 1.8,  d: 0.4,  h: 0.5,  color: '#e8e4dc', b: 'sideboard' },
  tv:         { label: 'Fernseher',      group: 'Wohnen',          w: 1.23, d: 0.05, h: 0.71, color: '#1b1b1b', b: 'tv', elev: 0.5 },
  shelf:      { label: 'Regal',          group: 'Wohnen',          w: 0.8,  d: 0.35, h: 1.9,  color: '#d9cbb2', b: 'shelf' },
  sideboard:  { label: 'Sideboard',      group: 'Wohnen',          w: 1.6,  d: 0.45, h: 0.8,  color: '#7a5c43', b: 'sideboard' },
  rug:        { label: 'Teppich',        group: 'Wohnen',          w: 2.0,  d: 1.4,  h: 0.01, color: '#b8a99a', b: 'rug' },
  lamp:       { label: 'Stehlampe',      group: 'Wohnen',          w: 0.4,  d: 0.4,  h: 1.6,  color: '#efe6d2', b: 'lamp' },

  const xs = r.poly.map(p => p.x), zs = r.poly.map(p => p.z);
  const rc = { minX: Math.min(...xs), maxX: Math.max(...xs), minZ: Math.min(...zs), maxZ: Math.max(...zs) };
  const ok = r.poly.every(p => (Math.abs(p.x - rc.minX) < 1e-3 || Math.abs(p.x - rc.maxX) < 1e-3) && (Math.abs(p.z - rc.minZ) < 1e-3 || Math.abs(p.z - rc.maxZ) < 1e-3));
  return ok ? rc : null;
}
function resizeRoom(r, axis, size, side) {
  const rc = roomRect(r);
  if (!rc) return;
  const other = axis === 'x' ? 'z' : 'x';
  const lo = axis === 'x' ? rc.minX : rc.minZ, hi = axis === 'x' ? rc.maxX : rc.maxZ;
  const olo = axis === 'x' ? rc.minZ : rc.minX, ohi = axis === 'x' ? rc.maxZ : rc.maxX;
  const delta = size - (hi - lo), edge = side === 'max' ? hi : lo, sign = side === 'max' ? 1 : -1;
  if (Math.abs(delta) < 1e-4) return;
  // Wandteile dieser Raumseite: parallel zur Seite, Wandachse um die halbe Dicke außerhalb der Innenkante
  const pts = [];
  for (const w of state.walls) {
    if (Math.abs(w.a[axis] - w.b[axis]) > 1e-4 || Math.abs(w.a[axis] - (edge + (sign * w.t) / 2)) > 0.01) continue;
    const s0 = Math.min(w.a[other], w.b[other]), s1 = Math.max(w.a[other], w.b[other]);
    if (s1 < olo - w.t || s0 > ohi + w.t) continue;
    for (const p of [w.a, w.b]) if (!pts.some(q => samePt(q, p))) pts.push({ ...p });
  }
  if (r.seed && !pts.length) { flash('Zu dieser Raumseite wurde keine passende Wand gefunden.'); return; }
  pushUndo();
  for (const p of pts) moveEndpoint(p, { ...p, [axis]: p[axis] + sign * delta });
  r.poly = r.poly.map(p => (Math.abs(p[axis] - edge) < 1e-3 ? { ...p, [axis]: p[axis] + sign * delta } : p));
  r.area = polygonArea(r.poly);
  if (r.seed) r.seed = polygonCentroid(r.poly);
  wallsChanged();
  rebuildRooms();
  renderProps();
  scheduleSave();
}

// Material-Editor: Vorlage, Art, Farbe(n), Größe, Richtung, Oberfläche
function matEditorHtml(id, spec, kind) {
  const types = kind === 'floor' ? FLOOR_TYPES : WALL_TYPES, presets = kind === 'floor' ? FLOOR_PRESETS : WALL_PRESETS;
  const t = spec.type, f = [];
  f.push(`<label>Art<select data-m="type">${Object.entries(types).map(([k, v]) => `<option value="${k}" ${k === t ? 'selected' : ''}>${v}</option>`).join('')}</select></label>`);
  f.push(`<label>Farbe<input type="color" data-m="color" value="${spec.color}"></label>`);
  if (['tiles', 'brick', 'stripes'].includes(t)) f.push(`<label>${t === 'stripes' ? 'Farbe 2' : 'Fugenfarbe'}<input type="color" data-m="color2" value="${spec.color2}"></label>`);
  if (t === 'planks' || t === 'panels') f.push(numField('Dielenbreite (cm)', 'w', cmTxt(spec.w)).replace('data-f', 'data-m'), numField('Dielenlänge (cm)', 'l', cmTxt(spec.l)).replace('data-f', 'data-m'));
  if (t === 'tiles') f.push(numField('Fliesengröße (cm)', 'w', cmTxt(spec.w)).replace('data-f', 'data-m'));
  if (t === 'stripes') f.push(numField('Streifenbreite (cm)', 'w', cmTxt(spec.w)).replace('data-f', 'data-m'));
  if (kind === 'floor' && (t === 'planks' || t === 'tiles')) {
    const opts = t === 'planks' ? [[0, 'längs (x)'], [90, 'quer (y)']] : [[0, 'gerade'], [45, 'diagonal']];
    f.push(`<label>Verlegung<select data-m="rot">${opts.map(([v, l]) => `<option value="${v}" ${v === (spec.rot || 0) ? 'selected' : ''}>${l}</option>`).join('')}</select></label>`);
  }
  f.push(`<label>Oberfläche<select data-m="gloss">${[['matt', 'matt'], ['satin', 'seidenmatt'], ['gloss', 'glänzend']].map(([v, l]) => `<option value="${v}" ${v === (spec.gloss || 'matt') ? 'selected' : ''}>${l}</option>`).join('')}</select></label>`);
  return `<div class="mat-ed" id="${id}">
    <div class="mat-head"><canvas class="mat-prev" width="44" height="44"></canvas>
      <label>Vorlage<select data-preset><option value="">– auswählen –</option>${Object.keys(presets).map(k => `<option>${k}</option>`).join('')}</select></label></div>
    <div class="grid2">${f.join('')}</div></div>`;
}
function bindMatEditor(id, spec, kind, onChange) {
  const el = document.getElementById(id);
  if (!el) return;
  const presets = kind === 'floor' ? FLOOR_PRESETS : WALL_PRESETS;
  const prev = el.querySelector('.mat-prev'), ctx = prev.getContext('2d'), tex = surfaceTexture(spec);
  if (tex) ctx.drawImage(tex.image, 0, 0, 128, 128, 0, 0, 44, 44); else { ctx.fillStyle = spec.color; ctx.fillRect(0, 0, 44, 44); }
  el.querySelector('[data-preset]').onchange = e => { if (e.target.value) onChange({ ...presets[e.target.value] }); };
  el.querySelectorAll('[data-m]').forEach(inp => (inp.onchange = () => {
    const k = inp.dataset.m;
    let next = { ...spec };
    if (k === 'type') next = { color: spec.color, gloss: spec.gloss, ...TYPE_DEFAULTS[inp.value], type: inp.value };
    else if (k === 'w' || k === 'l') {
      const v = parseFloat(String(inp.value).replace(',', '.')) / 100;
      if (!(v >= 0.02)) return renderProps();
      next[k] = v;
    } else if (k === 'rot') next.rot = +inp.value;
    else next[k] = inp.value;
    onChange(next);
  }));
}

function renderProps() {
  const el = $('#props');
  if (selection?.kind === 'item') {
    const it = getItem(selection.id);
    if (!it) { selection = null; return renderProps(); }
    const def = CATALOG[it.type];
    el.innerHTML = `
      <h3>${def.label}</h3>
      <label>Ersetzen durch
        <select id="pReplace">${Object.entries(CATALOG).map(([k, d]) => `<option value="${k}" ${k === it.type ? 'selected' : ''}>${d.group}: ${d.label}</option>`).join('')}</select>
      </label>
      <div class="grid2">
        ${numField('Breite (cm)', 'w', cmTxt(it.w))}
        ${numField('Tiefe (cm)', 'd', cmTxt(it.d))}
        ${numField('Höhe (cm)', 'h', cmTxt(it.h))}
        ${numField('über Boden (cm)', 'elev', cmTxt(it.elev || 0), 'min="0"')}
        ${numField('Position x (cm)', 'x', cmTxt(it.x), '')}
        ${numField('Position y (cm)', 'z', cmTxt(it.z), '')}
      </div>
      ${numField('Drehung (°)', 'rot', it.rot, 'step="1"')}
      <div class="row"><button data-rot="-90">⟲ 90°</button><button data-rot="-15">⟲ 15°</button><button data-rot="15">⟳ 15°</button><button data-rot="90">⟳ 90°</button></div>
      <label>Farbe <input type="color" data-f="color" value="${it.color}"></label>
      <div class="row"><button id="pDup">Duplizieren</button><button id="pDel" class="danger">Löschen</button></div>
      <p class="hint">Ziehen zum Verschieben · R: 90° drehen · Shift+R: 15° · Entf: löschen · Strg+D: duplizieren</p>`;
    el.querySelector('#pReplace').onchange = e => replaceItem(it, e.target.value);
    el.querySelectorAll('[data-rot]').forEach(b => (b.onclick = () => rotateSelection(+b.dataset.rot)));
    el.querySelector('#pDup').onclick = duplicateSelection;
    el.querySelector('#pDel').onclick = deleteSelection;
    el.querySelectorAll('[data-f]').forEach(inp => (inp.onchange = () => {
      const f = inp.dataset.f;
      let v = inp.value;
      if (f !== 'color') {
        v = parseFloat(String(v).replace(',', '.'));
        if (!isFinite(v)) return renderProps();
        if (f === 'rot') v = ((v % 360) + 360) % 360;
        else v = v / 100;
        if (['w', 'd', 'h'].includes(f) && v <= 0) return renderProps();
        if (f === 'elev' && v < 0) v = 0;
      }
      pushUndo();
      it[f] = v;
      rebuildItem(it); rebuildFloor(); scheduleSave();
    }));
    return;
  }
  if (selection?.kind === 'wall') {
    const w = getWall(selection.id);
    if (!w) { selection = null; return renderProps(); }
    const L = dist(w.a, w.b);
    el.innerHTML = `
      <h3>${{ wall: 'Wand', door: 'Tür', window: 'Fenster' }[w.type]}</h3>
      <label>Art
        <select data-f="type"><option value="wall">Wand</option><option value="door">Tür (Öffnung)</option><option value="window">Fenster</option></select>
      </label>
      <div class="grid2">
        ${numField('Länge (cm)', 'len', cmTxt(L))}
        ${numField('Dicke (cm)', 't', cmTxt(w.t))}
        ${numField('Raumhöhe (cm)', 'h', cmTxt(w.h))}
        ${w.type === 'door' ? numField('Türhöhe (cm)', 'oh', cmTxt(w.oh)) : ''}
        ${w.type === 'window' ? numField('Brüstung (cm)', 'sill', cmTxt(w.sill), 'min="0"') + numField('Oberkante (cm)', 'top', cmTxt(w.top)) : ''}
      </div>
      ${['L', 'R'].map(side => {
        const room = sideRoom(w, side), own = variant().wallSides[`${w.id}:${side}`];
        const title = room ? `Seite zum Raum „${esc(room.name)}“` : `Seite ohne Raum (${side === 'L' ? 'links' : 'rechts'} in Zeichenrichtung)`;
        return `<h3 style="margin-top:12px">${title}</h3>
          <label>Oberfläche<select data-side="${side}"><option value="room" ${own ? '' : 'selected'}>${room ? 'wie Raum' : 'Standard (weiß)'}</option><option value="own" ${own ? 'selected' : ''}>eigene Oberfläche</option></select></label>
          ${own ? matEditorHtml('edSide' + side, own, 'wall') : ''}`;
      }).join('')}
      <div class="row"><button id="pDel" class="danger">Löschen</button></div>
      <p class="hint">Oberflächen gelten für die Variante „${esc(variant().name)}“ und sind in der 3D-Ansicht sichtbar. Die Länge wird am Endpunkt verändert, angeschlossene Wände folgen. Wandecken (orange Quadrate) lassen sich im 2D-Werkzeug „Auswählen“ ziehen.</p>`;
    el.querySelector('[data-f="type"]').value = w.type;
    for (const side of ['L', 'R']) {
      const key = `${w.id}:${side}`;
      el.querySelector(`[data-side="${side}"]`).onchange = e => {
        pushUndo();
        if (e.target.value === 'own') variant().wallSides[key] = { ...wallSideSpec(w, side) };
        else delete variant().wallSides[key];
        rebuildWalls(); renderProps(); scheduleSave();
      };
      if (variant().wallSides[key]) bindMatEditor('edSide' + side, variant().wallSides[key], 'wall', spec => { pushUndo(); variant().wallSides[key] = spec; rebuildWalls(); renderProps(); scheduleSave(); });
    }
    el.querySelector('#pDel').onclick = deleteSelection;
    el.querySelectorAll('[data-f]').forEach(inp => (inp.onchange = () => {
      const f = inp.dataset.f, s = state.settings;
      pushUndo();
      if (f === 'type') {
        w.type = inp.value;
        if (w.type === 'door' && w.oh == null) w.oh = s.doorHeight;
        if (w.type === 'window' && w.sill == null) { w.sill = s.windowSill; w.top = s.windowTop; }
      } else {
        const v = parseFloat(String(inp.value).replace(',', '.')) / 100;
        if (!(v >= 0) || (f !== 'sill' && v === 0)) { undoStack.pop(); return renderProps(); }
        if (f === 'len') setWallLength(w, v); else w[f] = v;
      }
      wallsChanged(); renderProps(); scheduleSave();
    }));
    return;
  }
  if (selection?.kind === 'room') {
    const r = getRoom(selection.id);
    if (!r) { selection = null; return renderProps(); }
    el.innerHTML = `
      <h3>Raum</h3>
      <label>Name<input type="text" id="rName" value="${esc(r.name)}"></label>
      ${(() => {
        const rc = roomRect(r);
        if (!rc) return '<p class="hint">Innenmaße lassen sich nur bei rechteckigen, gerade ausgerichteten Räumen per Zahl ändern. Sonst: Wandecken im 2D-Grundriss ziehen.</p>';
        const sel = (axis, a, b) => `<select data-rside="${axis}"><option value="max" ${resizeSide[axis] === 'max' ? 'selected' : ''}>${a}</option><option value="min" ${resizeSide[axis] === 'min' ? 'selected' : ''}>${b}</option></select>`;
        return `<h3 style="margin-top:12px">Innenmaße</h3>
          <div class="grid2">
            <label>Breite (cm)<input type="number" data-dim="x" min="30" value="${cmTxt(rc.maxX - rc.minX)}"></label>
            <label>Tiefe (cm)<input type="number" data-dim="z" min="30" value="${cmTxt(rc.maxZ - rc.minZ)}"></label>
            <label>Es bewegt sich${sel('x', 'rechte Wand', 'linke Wand')}</label>
            <label>Es bewegt sich${sel('z', 'untere Wand', 'obere Wand')}</label>
          </div>
          <p class="hint">Links/rechts/oben/unten wie im 2D-Grundriss. Türen und Fenster wandern mit ihrer Wand, Möbel bleiben stehen. Grenzt die Wand an einen anderen Raum, ändert sich dieser mit.</p>`;
      })()}
      <h3 style="margin-top:12px">Boden <span class="hint">(Variante „${esc(variant().name)}“)</span></h3>
      ${matEditorHtml('edFloor', floorSpec(r), 'floor')}
      <h3 style="margin-top:12px">Wände des Raums</h3>
      ${matEditorHtml('edRoomWall', roomWallSpec(r), 'wall')}
      <p class="hint">Gilt für alle Wandseiten zu diesem Raum. Einzelne Wände lassen sich abweichend gestalten: Wand anklicken.</p>
      <p><b>Fläche: ${fmtArea(r.area)} m²</b><br>
        <span class="hint">${r.seed ? 'Innenfläche bis zur Wandinnenseite, automatisch aus den Wänden ermittelt. Passt sich an, wenn du Wände änderst.' : 'Von Hand gezeichnetes Polygon; Fläche der gezeichneten Form.'}</span></p>
      ${r.stale ? '<p class="warn">Der Raum ist zurzeit nicht ringsum von Wänden umschlossen. Angezeigt wird die letzte gültige Fläche.</p>' : ''}
      <div class="row">${r.seed ? '<button id="rDetect">Neu erkennen</button>' : ''}<button id="pDel" class="danger">Löschen</button></div>
      <p class="hint">Hinweis: Das ist keine Wohnflächenberechnung nach Wohnflächenverordnung (z.&nbsp;B. ohne Abzüge für Dachschrägen).</p>`;
    el.querySelector('#rName').onchange = e => { pushUndo(); r.name = e.target.value.trim() || r.name; rebuildRooms(); renderProps(); scheduleSave(); };
    el.querySelectorAll('[data-rside]').forEach(s => (s.onchange = () => { resizeSide[s.dataset.rside] = s.value; }));
    el.querySelectorAll('[data-dim]').forEach(inp => (inp.onchange = () => {
      const v = parseFloat(String(inp.value).replace(',', '.')) / 100;
      if (!(v >= 0.3)) { flash('Mindestens 30 cm.'); return renderProps(); }
      resizeRoom(r, inp.dataset.dim, v, resizeSide[inp.dataset.dim]);
    }));
    bindMatEditor('edFloor', floorSpec(r), 'floor', spec => { pushUndo(); variant().floors[r.id] = spec; rebuildRooms(); renderProps(); scheduleSave(); });
    bindMatEditor('edRoomWall', roomWallSpec(r), 'wall', spec => { pushUndo(); variant().roomWalls[r.id] = spec; rebuildWalls(); renderProps(); scheduleSave(); });
    el.querySelector('#pDel').onclick = deleteSelection;
    const det = el.querySelector('#rDetect');
    if (det) det.onclick = () => { redetectRooms(); renderProps(); scheduleSave(); if (r.stale) flash('Raum ist nicht geschlossen.'); };
    return;
  }
  const s = state.settings;
  const total = state.rooms.reduce((a, r) => a + r.area, 0);
  const roomsHtml = state.rooms.length ? `
    <h3 style="margin-top:10px">Räume</h3>
    <table class="rooms">
      ${state.rooms.map(r => `<tr data-room="${r.id}"><td><span class="swatch" style="background:${roomColor(r)}"></span>${esc(r.name)}${r.stale ? ' <span class="warn">⚠</span>' : ''}</td><td>${fmtArea(r.area)} m²</td></tr>`).join('')}
      <tr class="sum"><td>Summe</td><td>${fmtArea(total)} m²</td></tr>
    </table>` : '';
  el.innerHTML = `${roomsHtml}
    <p class="hint">Nichts ausgewählt. Standardwerte für neue Wände, Türen und Fenster:</p>
    <div class="grid2">
      ${numField('Wandhöhe (cm)', 'wallHeight', cmTxt(s.wallHeight))}
      ${numField('Wanddicke (cm)', 'wallThickness', cmTxt(s.wallThickness))}
      ${numField('Türbreite (cm)', 'doorWidth', cmTxt(s.doorWidth))}
      ${numField('Türhöhe (cm)', 'doorHeight', cmTxt(s.doorHeight))}
      ${numField('Fensterbreite (cm)', 'windowWidth', cmTxt(s.windowWidth))}
      ${numField('Brüstung (cm)', 'windowSill', cmTxt(s.windowSill), 'min="0"')}
      ${numField('Fenster-Oberkante (cm)', 'windowTop', cmTxt(s.windowTop))}
    </div>
    <div class="row"><button id="applyHeight">Wandhöhe auf alle Wände anwenden</button></div>
    <label>Bodenfarbe außerhalb von Räumen <input type="color" id="floorColor" value="${s.floorColor}"></label>
    <p class="hint"><b>So geht's:</b> 1. Grundriss-Bild laden. 2. „Maßstab“: zwei Punkte mit bekanntem Abstand anklicken und echte Länge eingeben. 3. „Wand“: Wände nachzeichnen. 4. „Tür“/„Fenster“: auf Wände klicken. 5. „Raum“: in jeden Raum klicken – Fläche und Bodenfarbe erscheinen. 6. Möbel aus der Liste hinzufügen und verschieben; über „Ersetzen durch“ austauschen. 7. Varianten für verschiedene Einrichtungen anlegen.</p>`;
  el.querySelectorAll('[data-f]').forEach(inp => (inp.onchange = () => {
    const v = parseFloat(String(inp.value).replace(',', '.')) / 100;
    if (!(v >= 0)) return renderProps();
    pushUndo();
    s[inp.dataset.f] = v;
    scheduleSave();
  }));
  el.querySelector('#applyHeight').onclick = () => {
    pushUndo();
    state.walls.forEach(w => (w.h = s.wallHeight));
    rebuildWalls(); scheduleSave();
  };
  el.querySelectorAll('tr[data-room]').forEach(tr => (tr.onclick = () => select({ kind: 'room', id: tr.dataset.room })));
  el.querySelector('#floorColor').onchange = e => { pushUndo(); s.floorColor = e.target.value; rebuildFloor(); scheduleSave(); };
}

// Kopfzeile: Varianten, Bild, Export/Import

function renderVariantSelect() {
  $('#variantSelect').innerHTML = state.variants.map(v => `<option value="${v.id}" ${v.id === state.activeVariant ? 'selected' : ''}>${esc(v.name)}</option>`).join('');
  $('#variantDelete').disabled = state.variants.length < 2;
}
$('#variantSelect').onchange = e => { state.activeVariant = e.target.value; selection = null; rebuildItems(); rebuildRooms(); rebuildWalls(); rebuildFloor(); renderProps(); scheduleSave(); };
$('#variantNew').onclick = () => {
  const name = prompt('Name der neuen Variante:', `Variante ${state.variants.length + 1}`);
  if (!name) return;
  pushUndo();
  const cur = variant();
  const v = { id: uid(), name, items: items().map(it => ({ ...it, id: uid() })),
    ...JSON.parse(JSON.stringify({ roomColors: cur.roomColors, floors: cur.floors, roomWalls: cur.roomWalls, wallSides: cur.wallSides })) };
  state.variants.push(v);
  state.activeVariant = v.id;
  selection = null;
  refreshAll(); scheduleSave();
};
$('#variantRename').onclick = () => {
  const name = prompt('Neuer Name:', variant().name);
  if (!name) return;
  pushUndo(); variant().name = name; renderVariantSelect(); scheduleSave();
};
$('#variantDelete').onclick = () => {
  if (state.variants.length < 2 || !confirm(`Variante „${variant().name}“ löschen?`)) return;
  pushUndo();
  state.variants = state.variants.filter(v => v.id !== state.activeVariant);
  state.activeVariant = state.variants[0].id;
  selection = null;
  refreshAll(); scheduleSave();
};

function syncHeaderInputs() {
  $('#planOpacity').value = state.plan.opacity;
  $('#plan3d').checked = state.plan.show3d;
  $('#wallMode').value = state.settings.wallMode;
}
$('#planOpacity').oninput = e => { state.plan.opacity = +e.target.value; rebuildPlan(); scheduleSave(); };
$('#plan3d').onchange = e => { state.plan.show3d = e.target.checked; rebuildPlan(); scheduleSave(); };
$('#wallMode').onchange = e => { state.settings.wallMode = e.target.value; rebuildWalls(); scheduleSave(); };

$('#loadImage').onclick = () => $('#imageFile').click();
$('#imageFile').onchange = e => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      // auf max. 2048 px verkleinern, damit es in den Browser-Speicher passt
      const scale = Math.min(1, 2048 / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(img, 0, 0, c.width, c.height);
      state.plan.image = c.toDataURL('image/jpeg', 0.85);
      state.plan.aspect = c.height / c.width;
      rebuildPlan();
      if (!state.walls.length) { rebuildFloor(); fitView(); }
      scheduleSave();
      setMode('2d');
      setTool('calibrate');
      flash('Bild geladen. Jetzt den Maßstab festlegen: zwei Punkte mit bekanntem Abstand anklicken.');
    };
    img.onerror = () => flash('Bild konnte nicht gelesen werden.');
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
};

$('#exportJson').onclick = () => {
  const blob = new Blob([JSON.stringify(state, null, 1)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `wohnung-${new Date().toISOString().slice(0, 10)}.json`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};
$('#importJson').onclick = () => $('#jsonFile').click();
$('#jsonFile').onchange = e => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  file.text().then(txt => {
    const data = JSON.parse(txt);
    if (!Array.isArray(data.walls) || !Array.isArray(data.variants)) throw new Error('format');
    if (!confirm('Aktuellen Stand durch die importierte Datei ersetzen?')) return;
    pushUndo();
    state = normalizeState(data);
    selection = null;
    refreshAll(); fitView(); saveNow();
  }).catch(() => flash('Datei ist keine gültige Wohnungsplaner-Datei.'));
};
$('#resetAll').onclick = () => {
  if (!confirm('Alles löschen (Grundriss, Wände, alle Varianten)? Tipp: vorher „Export“.')) return;
  pushUndo();
  state = normalizeState(newState());
  selection = null;
  refreshAll(); fitView(); saveNow();
};
$('#panelToggle').onclick = () => document.body.classList.toggle('panel-open');
const narrow = () => window.matchMedia('(max-width: 900px)').matches;
$('#undo').onclick = undo;
$('#redo').onclick = redo;
$('#view2d').onclick = () => setMode('2d');
$('#view3d').onclick = () => setMode('3d');
$('#fitView').onclick = fitView;
document.querySelectorAll('#toolGroup button').forEach(b => (b.onclick = () => setTool(b.dataset.tool)));

// ---------------------------------------------------------------------------
// Statuszeile
// ---------------------------------------------------------------------------
let flashMsg = '', flashTimer = null;
function flash(msg) { flashMsg = msg; clearTimeout(flashTimer); flashTimer = setTimeout(() => { flashMsg = ''; updateHint(); }, 5000); updateHint(); }
function updateHint(extra) {
  const hints = {
    select: 'Klicken/Tippen: auswählen · Möbel/Wandecken ziehen · freie Fläche ziehen, rechte Maustaste oder 2 Finger: verschieben · Mausrad/2 Finger: Zoom',
    wall: 'Klicken/Tippen setzt Wandpunkte · Doppelklick, Enter, langes Tippen oder „Fertig“ beendet · Shift: ohne Winkelfang',
    door: `Auf eine Wand klicken, um eine Tür (${cmTxt(state.settings.doorWidth)} cm) einzusetzen`,
    window: `Auf eine Wand klicken, um ein Fenster (${cmTxt(state.settings.windowWidth)} cm) einzusetzen`,
    calibrate: 'Zwei Punkte mit bekanntem Abstand anklicken (z. B. Enden einer bemaßten Wand)',
    room: 'In einen von Wänden umschlossenen Raum klicken/tippen – Raum und Fläche werden erkannt',
    roomdraw: 'Raumecken setzen · ersten Punkt erneut, Doppelklick, Enter oder „Fertig“ schließt den Raum',
  };
  const base = mode === '3d' ? 'Linke Maustaste/1 Finger: drehen · rechte Maustaste/2 Finger: verschieben + Zoom · Möbel anklicken und ziehen' : hints[tool];
  const el = $('#hint');
  el.innerHTML = saveWarning ? `<span class="warn">${esc(saveWarning)}</span>` : esc(flashMsg || extra || base);
}

// ---------------------------------------------------------------------------
// Start
// ---------------------------------------------------------------------------
renderCatalog();
new ResizeObserver(resize).observe(viewportEl);
resize();
refreshAll();
fitView();
setTool('select');
updateUndoButtons();

renderer.setAnimationLoop(() => {
  if (mode === '3d') controls.update();
  if (mode === '2d') { const s = pxToM(9); handlesGroup.children.forEach(h => h.scale.set(s, s, 1)); }
  renderer.render(scene, camera());
  updateLabels();
});

// für automatisierte Tests
window.__planner = {
  get state() { return state; }, setMode, setTool, addItem, fitView, select,
  toScreen(x, z, y = 0) {
    const v = new THREE.Vector3(x, y, z).project(camera());
    return [((v.x + 1) / 2) * canvas.clientWidth, ((1 - v.y) / 2) * canvas.clientHeight];
  },
};
</script>
</body>
